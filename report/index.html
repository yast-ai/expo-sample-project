<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expo × Boat · Build lab</title>
<style>
:root{color-scheme:dark;--bg:#0c1118;--panel:#131b26;--line:#263142;--ink:#eef4ff;--muted:#91a1b8;--cold:#647dff;--warm:#46d6bd;--warn:#ffc36b;--red:#ff7983}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;font-variant-numeric:tabular-nums}main{max-width:1500px;margin:auto;padding:32px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:30px;letter-spacing:-1px;margin:0}h2{font-size:17px;margin:0 0 22px}h3{font-size:15px;margin:0}small,.muted{color:var(--muted)}.badge{display:inline-flex;padding:6px 10px;border-radius:20px;background:#263142;font-size:11px;letter-spacing:.5px;text-transform:uppercase}.success{color:var(--warm);background:#163a36}.error{color:var(--red);background:#3b202b}.running{color:var(--warn);background:#3b3020}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin:28px 0}.stat,.panel,.project{background:var(--panel);border-radius:14px;padding:22px}.number{font-size:32px;font-weight:600;margin:10px 0 0}.projects{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.project-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.project small{display:block;margin:10px 0 18px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.step{height:5px;background:#293547;border-radius:4px}.step.done{background:var(--warm)}.step.active{background:var(--warn)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.panel{min-height:245px}.chart-row{margin:18px 0}.barline{display:grid;grid-template-columns:35px 1fr 76px;gap:9px;align-items:center;font-size:12px;margin-top:6px}.barvalue{text-align:right;color:var(--ink)}.delta{font-size:11px;color:var(--warm)}.chart-label{align-items:center}.chart-label{display:flex;justify-content:space-between;font-size:12px;margin:0 0 6px}.timeline{grid-column:1/-1}.stacked{display:flex}.timeline .legend{flex-wrap:wrap}.phase-values{display:flex;justify-content:flex-end;gap:18px;font-size:11px;margin-top:5px}.bars{display:grid;gap:4px}.track{background:#202b3b;height:9px;border-radius:2px;overflow:hidden}.bar{height:100%;background:var(--cold);min-width:0;transition:width .4s}.bar.warm{background:var(--warm)}.legend{display:flex;gap:16px;font-size:12px;color:var(--muted)}.dot{display:inline-block;width:8px;height:8px;background:var(--cold);border-radius:2px;margin-right:6px}.dot.warm{background:var(--warm)}.runs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.run{padding:16px;background:var(--panel);border-radius:10px}.run-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:15px}.run-values{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.run-values b{display:block;margin:5px 0;font-size:16px}.spark{height:42px;display:flex;align-items:flex-end;gap:1px;margin-top:14px}.spark i{flex:1;min-width:1px;background:var(--cold);opacity:.8}.footer{display:flex;justify-content:space-between;gap:16px;margin-top:25px;font-size:12px;color:var(--muted)}a{color:var(--warm);text-decoration:none}.empty{color:var(--muted)}@media(max-width:1000px){.projects,.runs{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){main{padding:16px}header{align-items:flex-start}h1{font-size:24px}.projects,.grid,.runs{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.number{font-size:26px}}
</style></head><body><main>
<header><div><h1>Expo × Boat</h1><p class="muted">Android build lab · SDK 57</p></div><div><span class="badge running" id="live">LIVE</span><p><small id="updated">—</small></p></div></header>
<div class="stats" id="stats"></div><div class="projects" id="projects"></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:32px"><h2>Cold / Warm · cache</h2><div class="legend"><span><i class="dot"></i>Cold</span><span><i class="dot warm"></i>Warm</span></div></div>
<div class="grid" id="charts"></div><h2>Comparison</h2><div class="grid" id="extras"></div><h2>Sandboxes</h2><div class="runs" id="runs"></div>
<div class="grid" id="insights"></div><div class="footer"><span>1s samples · 15s polling · VM CPU · warm = same VM + Gradle cache</span><a href="https://github.com/yast-ai/expo-sample-project">GitHub ↗</a></div>
</main><script src="./app.js"></script></body></html>
